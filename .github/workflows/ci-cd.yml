name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mess-food-feedback-tracker .

      - name: Run Docker container
        run: |
          docker run -d --name mess-food-feedback-tracker-container -p 3000:3000 mess-food-feedback-tracker
          sleep 5

      - name: Check Docker health endpoint
        run: curl -f http://localhost:3000/health

      - name: Stop Docker container
        if: always()
        run: docker stop mess-food-feedback-tracker-container || true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - lint-and-test
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Verification placeholder
        run: echo "Live health check will be configured after deployment."